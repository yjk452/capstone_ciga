model:
  save_val_output: true
  save_val_metrics: true
  max_save_val_output: 80
  renderer_output_types: null

  # log_cfg:
  #   log: true
  #   step: 50

  gaussian:
    class_path: internal.models.gaussian_2d.Gaussian2D
    init_args:
      sh_degree: 2
      optimization:
        means_lr_init: 0.000064
        means_lr_scheduler:
          lr_final: 0.00000064
          max_steps: 30_000
        scales_lr: 0.004
  metric:
    class_path: internal.metrics.citygsv2_metrics.CityGSV2Metrics
    init_args:
      lambda_normal: 0.0125
      normal_regularization_from_iter: 0
      depth_loss_type: l1+ssim
      depth_loss_ssim_weight: 1.0
      depth_loss_weight:
        init: 0.5
        final_factor: 0.05
        max_steps: 30_000
  renderer: 
    class_path: internal.renderers.sep_depth_trim_2dgs_renderer_ciga.SepDepthTrim2DGSRenderer
    init_args:
      depth_ratio: 1.0
      mlp_cfg:
        use_gate_mlp: true

  density: 
    class_path: internal.density_controllers.citygsv2_density_controller.CityGSV2DensityController
    init_args:
      densification_interval: 200
      opacity_reset_interval: 6000
      densify_from_iter: 1000
      densify_until_iter: 30_000
trainer:
     num_sanity_val_steps: 0
     max_steps: 1
data:
  path: /home/jinholee/Ciga/data/dataset/SF/traina20g1.8
  parser:
    class_path: EstimatedDepthBlockColmap
    init_args:
      down_sample_factor: 1.0
      content_threshold: 0.08
      split_mode: experiment
      block_dim:
      - 3
      - 3

save_iterations:
- 15000
- 30000